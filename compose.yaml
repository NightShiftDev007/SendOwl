name: sandowl

services:
  postgres:
    image: postgres:16.8-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$$POSTGRES_PASSWORD" psql --host=127.0.0.1 --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB" --no-password --tuples-only --command='SELECT 1' | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  postgres-test:
    profiles:
      - test
    image: postgres:16.8-alpine3.21
    restart: "no"
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-sandowl_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-sandowl_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-local-test-postgres-password-change-me}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$$POSTGRES_PASSWORD" psql --host=127.0.0.1 --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB" --no-password --tuples-only --command='SELECT 1' | grep -q 1
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  backend-postgres-test:
    profiles:
      - test
    image: sandowl-backend-test:2.0.0-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    restart: "no"
    environment:
      APP_ENV: test
      DATABASE_URL: ${TEST_POSTGRES_DATABASE_URL:-postgresql://sandowl_test:local-test-postgres-password-change-me@postgres-test:5432/sandowl_test}
      TEST_POSTGRES_DATABASE_URL: ${TEST_POSTGRES_DATABASE_URL:-postgresql://sandowl_test:local-test-postgres-password-change-me@postgres-test:5432/sandowl_test}
    depends_on:
      postgres-test:
        condition: service_healthy
    command:
      - /bin/sh
      - tests/run_postgresql.sh
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.2-alpine3.21
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  migrate:
    image: sandowl-backend:2.0.0-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - alembic
      - upgrade
      - head
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  backend:
    image: sandowl-backend:2.0.0-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - ${HOST_BIND:?HOST_BIND is required}:${BACKEND_PORT:?BACKEND_PORT is required}:8000
    volumes:
      - web_artifacts:/web-artifacts:ro
      - linux_artifacts:/linux-artifacts:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  acme-support-sample:
    image: sandowl-acme-support-sample:1.0.0-b3609ac5
    build:
      context: ./backend/acme_support_sample
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  acme-support-mcp-sample:
    image: sandowl-acme-support-mcp-sample:1.0.0-5fbc2623
    build:
      context: ./backend/acme_support_mcp_sample
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 8s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  matraix-web-browser:
    image: sandowl-matraix-web-browser:1.0.0
    build:
      context: ./backend/web_browser_executor
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    volumes:
      - web_artifacts:/web-artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true

  matraix-linux-runner:
    image: sandowl-matraix-linux-runner:1.0.0
    build:
      context: ./backend/linux_artifact_runner
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    volumes:
      - linux_artifacts:/linux-artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - linux_runner
    security_opt:
      - no-new-privileges:true

  semantic-worker:
    image: sandowl-oasis-worker:2.0.0-dev
    build:
      context: ./backend
      dockerfile: OasisWorker.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OASIS_ARTIFACT_ROOT: /artifacts
      OASIS_WORKER_ID: sandowl-compose-semantic-worker
      OASIS_WORKER_DOMAIN: semantic
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
      DASHSCOPE_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${LLM_API_KEY:-}
      OPENAI_BASE_URL: ${LLM_BASE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - daemon
    working_dir: /tmp
    volumes:
      - oasis_artifacts:/artifacts
    networks:
      - default
      - linux_runner
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  evaluation-worker:
    image: sandowl-oasis-worker:2.0.0-dev
    build:
      context: ./backend
      dockerfile: OasisWorker.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OASIS_ARTIFACT_ROOT: /artifacts
      OASIS_WORKER_ID: sandowl-compose-evaluation-worker
      OASIS_WORKER_DOMAIN: evaluation
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
      CHATBOT_SUT_BASE_URL: http://acme-support-sample:8000
      CHATBOT_MCP_SUT_URL: http://acme-support-mcp-sample:8000/mcp
      MATRAIX_WEB_BROWSER_URL: http://matraix-web-browser:8000
      MATRAIX_LINUX_RUNNER_URL: http://matraix-linux-runner:8000
    depends_on:
      acme-support-sample:
        condition: service_healthy
      acme-support-mcp-sample:
        condition: service_healthy
      matraix-web-browser:
        condition: service_healthy
      matraix-linux-runner:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - daemon
    working_dir: /tmp
    volumes:
      - oasis_artifacts:/artifacts
    networks:
      - default
      - linux_runner
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  report-worker:
    image: sandowl-oasis-worker:2.0.0-dev
    build:
      context: ./backend
      dockerfile: OasisWorker.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OASIS_ARTIFACT_ROOT: /artifacts
      OASIS_WORKER_ID: sandowl-compose-report-worker
      OASIS_WORKER_DOMAIN: report
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - daemon
    working_dir: /tmp
    volumes:
      - oasis_artifacts:/artifacts
    networks:
      - default
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  media-collector-worker:
    image: sandowl-backend:2.0.0-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MEDIA_COLLECTION_SCAN_INTERVAL_SECONDS: ${MEDIA_COLLECTION_SCAN_INTERVAL_SECONDS:-60}
      MEDIA_COLLECTION_SOURCE_BATCH_SIZE: ${MEDIA_COLLECTION_SOURCE_BATCH_SIZE:-5}
      MEDIA_COLLECTION_WORKER_ID: ${MEDIA_COLLECTION_WORKER_ID:-sandowl-native-media-collector}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - app.media.collection.worker
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  harbor-dind:
    image: docker:27-dind-rootless
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2375
      - --tls=false
    expose:
      - "2375"
    volumes:
      - harbor_docker_data:/var/lib/docker
      - harbor_workspace:/workspace
    networks:
      - harbor_runtime

  harbor-runner:
    image: sandowl-harbor-runner:0.1.0-ea16f18
    build:
      context: ./backend/harbor_runner
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DOCKER_HOST: tcp://harbor-dind:2375
      REMOTE_RUNNER_INLINE: "0"
      REMOTE_RUNNER_HARBOR_COMMAND: harbor run
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
      DASHSCOPE_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${LLM_API_KEY:-}
      OPENAI_BASE_URL: ${LLM_BASE_URL:-}
    depends_on:
      harbor-dind:
        condition: service_started
    expose:
      - "9100"
    volumes:
      - harbor_workspace:/workspace
      - harbor_jobs:/workspace/jobs
    networks:
      - default
      - harbor_runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  harbor-workspace-init:
    image: sandowl-backend:2.0.0-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: "no"
    user: "0:0"
    depends_on:
      harbor-runner:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - mkdir -p /harbor-workspace/sandowl_personas /harbor-workspace/sandowl_tasks && chown -R 10001:10001 /harbor-workspace/sandowl_personas /harbor-workspace/sandowl_tasks
    volumes:
      - harbor_workspace:/harbor-workspace
    networks:
      - default
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  evaluation-job-worker:
    image: sandowl-backend:2.0.0-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      HARBOR_RUNNER_URL: http://harbor-runner:9100
      HARBOR_WORKSPACE_PATH: /harbor-workspace
      HARBOR_RUNNER_WORKSPACE_PATH: /workspace
      HARBOR_JOBS_PATH: /harbor-jobs
      HARBOR_MODEL_NAME: ${HARBOR_MODEL_NAME:-dashscope/qwen3.7-plus}
    depends_on:
      migrate:
        condition: service_completed_successfully
      harbor-runner:
        condition: service_healthy
      harbor-workspace-init:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - app.research_evaluations.job_worker
    volumes:
      - harbor_workspace:/harbor-workspace
      - harbor_jobs:/harbor-jobs:ro
    networks:
      - default
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  media-sync-worker:
    profiles:
      - media-sync
    image: sandowl-backend:2.0.0-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: "no"
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AGENDASCOPE_DATABASE_URL: ${AGENDASCOPE_DATABASE_URL:-}
      AGENDASCOPE_EXPECTED_DATABASE_NAME: ${AGENDASCOPE_EXPECTED_DATABASE_NAME:-}
      AGENDASCOPE_EXPECTED_SCHEMA_REVISION: ${AGENDASCOPE_EXPECTED_SCHEMA_REVISION:-}
      MEDIA_SYNC_INTERVAL_SECONDS: ${MEDIA_SYNC_INTERVAL_SECONDS:-}
      MEDIA_SYNC_WORKER_ID: ${MEDIA_SYNC_WORKER_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - app.media.sync_worker
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  frontend:
    image: sandowl-frontend:2.0.0-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - ${HOST_BIND:?HOST_BIND is required}:${FRONTEND_PORT:?FRONTEND_PORT is required}:8080
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: sandowl-postgres-data
  redis_data:
    name: sandowl-redis-data
  oasis_artifacts:
    name: sandowl-oasis-artifacts
  web_artifacts:
    name: sandowl-web-artifacts
  linux_artifacts:
    name: sandowl-linux-artifacts
  harbor_docker_data:
    name: sandowl-harbor-docker-data
  harbor_workspace:
    name: sandowl-harbor-workspace
  harbor_jobs:
    name: sandowl-harbor-jobs

networks:
  linux_runner:
    internal: true
  harbor_runtime:
    internal: true
