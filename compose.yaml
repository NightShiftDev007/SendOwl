name: sendowl

services:
  postgres:
    image: postgres:16.8-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$$POSTGRES_PASSWORD" psql --host=127.0.0.1 --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB" --no-password --tuples-only --command='SELECT 1' | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  postgres-test:
    profiles:
      - test
    image: postgres:16.8-alpine3.21
    restart: "no"
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-sendowl_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-sendowl_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-local-test-postgres-password-change-me}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$$POSTGRES_PASSWORD" psql --host=127.0.0.1 --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB" --no-password --tuples-only --command='SELECT 1' | grep -q 1
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  backend-postgres-test:
    profiles:
      - test
    image: sendowl-backend-test:2.0.0-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    restart: "no"
    environment:
      APP_ENV: test
      DATABASE_URL: ${TEST_POSTGRES_DATABASE_URL:-postgresql://sendowl_test:local-test-postgres-password-change-me@postgres-test:5432/sendowl_test}
      TEST_POSTGRES_DATABASE_URL: ${TEST_POSTGRES_DATABASE_URL:-postgresql://sendowl_test:local-test-postgres-password-change-me@postgres-test:5432/sendowl_test}
    depends_on:
      postgres-test:
        condition: service_healthy
    command:
      - /bin/sh
      - tests/run_postgresql.sh
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.2-alpine3.21
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  migrate:
    image: sendowl-backend:2.0.0-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - alembic
      - upgrade
      - head
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  backend:
    image: sendowl-backend:2.0.0-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - ${HOST_BIND:?HOST_BIND is required}:${BACKEND_PORT:?BACKEND_PORT is required}:8000
    volumes:
      - web_artifacts:/web-artifacts:ro
      - linux_artifacts:/linux-artifacts:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  acme-support-sample:
    image: sendowl-acme-support-sample:1.0.0
    build:
      context: ./backend/acme_support_sample
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  acme-support-mcp-sample:
    image: sendowl-acme-support-mcp-sample:1.0.0
    build:
      context: ./backend/acme_support_mcp_sample
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 8s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  matraix-web-browser:
    image: sendowl-matraix-web-browser:1.0.0
    build:
      context: ./backend/web_browser_executor
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    volumes:
      - web_artifacts:/web-artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true

  matraix-linux-runner:
    image: sendowl-matraix-linux-runner:1.0.0
    build:
      context: ./backend/linux_artifact_runner
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    volumes:
      - linux_artifacts:/linux-artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - linux_runner
    security_opt:
      - no-new-privileges:true

  oasis-worker:
    image: sendowl-oasis-worker:2.0.0-dev
    build:
      context: ./backend
      dockerfile: OasisWorker.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OASIS_ARTIFACT_ROOT: /artifacts
      OASIS_WORKER_ID: sendowl-compose-oasis-worker
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
      CHATBOT_SUT_BASE_URL: http://acme-support-sample:8000
      CHATBOT_MCP_SUT_URL: http://acme-support-mcp-sample:8000/mcp
      MATRAIX_WEB_BROWSER_URL: http://matraix-web-browser:8000
      MATRAIX_LINUX_RUNNER_URL: http://matraix-linux-runner:8000
    depends_on:
      acme-support-sample:
        condition: service_healthy
      acme-support-mcp-sample:
        condition: service_healthy
      matraix-web-browser:
        condition: service_healthy
      matraix-linux-runner:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - daemon
    working_dir: /tmp
    volumes:
      - oasis_artifacts:/artifacts
    networks:
      - default
      - linux_runner
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  media-sync-worker:
    profiles:
      - media-sync
    image: sendowl-backend:2.0.0-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: "no"
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AGENDASCOPE_DATABASE_URL: ${AGENDASCOPE_DATABASE_URL:-}
      AGENDASCOPE_EXPECTED_DATABASE_NAME: ${AGENDASCOPE_EXPECTED_DATABASE_NAME:-}
      AGENDASCOPE_EXPECTED_SCHEMA_REVISION: ${AGENDASCOPE_EXPECTED_SCHEMA_REVISION:-}
      MEDIA_SYNC_INTERVAL_SECONDS: ${MEDIA_SYNC_INTERVAL_SECONDS:-}
      MEDIA_SYNC_WORKER_ID: ${MEDIA_SYNC_WORKER_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - app.media.sync_worker
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  frontend:
    image: sendowl-frontend:2.0.0-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - ${HOST_BIND:?HOST_BIND is required}:${FRONTEND_PORT:?FRONTEND_PORT is required}:8080
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: sendowl-postgres-data
  redis_data:
    name: sendowl-redis-data
  oasis_artifacts:
    name: sendowl-oasis-artifacts
  web_artifacts:
    name: sendowl-web-artifacts
  linux_artifacts:
    name: sendowl-linux-artifacts

networks:
  linux_runner:
    internal: true
