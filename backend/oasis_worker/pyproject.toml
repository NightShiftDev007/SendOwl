[project]
name = "sandowl-oasis-worker"
version = "0.1.0"
description = "Isolated OASIS 0.2.5 manual-action smoke worker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "camel-ai==0.2.78",
    "camel-oasis==0.2.5",
    "mcp>=1.3.0,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "torch==2.5.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oasis_worker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: exercises the real OASIS runtime and SQLite database",
    "external_provider: makes a real provider call only when explicitly enabled",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
