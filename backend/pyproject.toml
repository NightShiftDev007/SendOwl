[project]
name = "ai-decision-center-v2-backend"
version = "0.1.0"
description = "AI Decision Center V2 control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "countryinfo>=0.1.2,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "pycountry>=24.6.1,<25.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0,<3.0.0",
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
