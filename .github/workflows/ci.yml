name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.33"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test:frontend

      - name: Type-check frontend
        run: pnpm typecheck:frontend

      - name: Build production frontend
        run: pnpm build:frontend

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --locked --python 3.12

      - name: Verify one Alembic head
        working-directory: backend
        run: |
          uv run python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly one Alembic head, found: {heads}")
          print(heads[0])
          PY

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

  oasis-worker:
    name: OASIS Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@v9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/oasis_worker/uv.lock

      - name: Install worker dependencies
        run: uv sync --project backend/oasis_worker --locked --python 3.11

      - name: Lint worker
        working-directory: backend/oasis_worker
        run: uv run --python 3.11 ruff check . && uv run --python 3.11 ruff format --check .

      - name: Run worker tests
        working-directory: backend/oasis_worker
        run: uv run --python 3.11 pytest

  postgresql:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.8-alpine3.21
        env:
          POSTGRES_DB: sandowl_test
          POSTGRES_USER: sandowl_test
          POSTGRES_PASSWORD: local-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandowl_test -d sandowl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://sandowl_test:local-ci-password@127.0.0.1:5432/sandowl_test
      TEST_POSTGRES_DATABASE_URL: postgresql://sandowl_test:local-ci-password@127.0.0.1:5432/sandowl_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --project backend --locked --python 3.12

      - name: Run isolated PostgreSQL suite
        working-directory: backend
        run: sh tests/run_postgresql.sh
